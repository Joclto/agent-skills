# Hindsight 中央记忆 · Docker Desktop 部署（vchord 变体：4B@2560 全维度）
# 结构：vchord PG18 + 一体镜像(API 8888 + Control Plane 9999 + 内嵌文本搜索升级)
name: hindsight

services:
  db:
    image: tensorchord/vchord-suite:pg18-latest
    container_name: hindsight-db
    restart: always
    # 数据库不对外发布端口（仅 compose 网络内部可达）
    # ports:
    #   - "5436:5432"
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight_db}
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
    networks:
      - hindsight-net

  vectorchord-init:
    image: tensorchord/vchord-suite:pg18-latest
    depends_on:
      - db
    environment:
      - PGPASSWORD=${HINDSIGHT_DB_PASSWORD:?set in .env}
    command: >
      bash -c "
        echo 'Waiting for PostgreSQL to be ready...';
        until pg_isready -h hindsight-db -p 5432 -U hindsight_user; do
          echo 'PostgreSQL is unavailable - sleeping'; sleep 2;
        done;
        echo 'PostgreSQL is ready - creating hindsight_db database';
        psql -h hindsight-db -p 5432 -U hindsight_user -c 'CREATE DATABASE hindsight_db;' 2>/dev/null || echo 'Database already exists';
        echo 'Creating extensions in hindsight_db database';
        psql -h hindsight-db -p 5432 -U hindsight_user -d hindsight_db -c 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;';
        psql -h hindsight-db -p 5432 -U hindsight_user -d hindsight_db -c 'CREATE EXTENSION IF NOT EXISTS pg_tokenizer CASCADE;';
        psql -h hindsight-db -p 5432 -U hindsight_user -d hindsight_db -c 'CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;';
        echo 'Creating llmlingua2 tokenizer';
        psql -h hindsight-db -p 5432 -U hindsight_user -d hindsight_db -c \"SELECT create_tokenizer('llmlingua2', \$\$ model = \"llmlingua2\" \$\$);\" 2>/dev/null || echo 'Tokenizer already exists or creation skipped';
        echo 'Database and extensions created successfully';
      "
    restart: "no"
    networks:
      - hindsight-net

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-latest}
    container_name: hindsight-app
    stop_grace_period: 75s
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      # LLM（国内智谱端点，Coding key 必须带 /api/coding/）
      HINDSIGHT_API_LLM_PROVIDER: zai
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set in .env}
      HINDSIGHT_API_LLM_MODEL: glm-5.3-flash
      HINDSIGHT_API_LLM_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "2"
      # 数据库（vchord 容器内）
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_DB_USER:-hindsight_user}:${HINDSIGHT_DB_PASSWORD}@db:5432/${HINDSIGHT_DB_NAME:-hindsight_db}
      # 向量/文本扩展（vchord：解锁 >2000 维）
      HINDSIGHT_API_VECTOR_EXTENSION: vchord
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: vchord
      # 嵌入（4B 原生 2560 维）
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: Qwen/Qwen3-Embedding-4B
      # 模型下载走国内镜像；首启大下载放宽初始化超时
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /home/hindsight/.cache/huggingface
      HINDSIGHT_API_MODEL_INIT_TIMEOUT: "3600"
    volumes:
      - hf_cache:/home/hindsight/.cache/huggingface
    depends_on:
      - db
    networks:
      - hindsight-net

networks:
  hindsight-net:
    driver: bridge

volumes:
  pg_data:
  hf_cache:
